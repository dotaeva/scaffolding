<svg xmlns="http://www.w3.org/2000/svg" width="640" height="518" viewBox="0 0 640 518" role="img" aria-labelledby="result-dark-title result-dark-desc">
<title id="result-dark-title">Awaiting a child result</title>
<desc id="result-dark-desc">The presenter awaits a picker while the child stays interactive. The child dismisses its whole flow returning an item. After the branch is removed, the presenter resumes with Item?. Dismissal without a value yields nil; cancelling the waiting task leaves the UI open.</desc>
<defs>
<marker id="result-dark-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.5"/></marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="32" y="16" width="224" height="56" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="144.0" y="52.0" font-size="24" text-anchor="middle" fill="#FFFFFF">Presenter</text>
<rect x="384" y="16" width="224" height="56" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="496.0" y="52.0" font-size="24" text-anchor="middle" fill="#FFFFFF">Child flow</text>
<path d="M144 72 V376" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6 5"/>
<path d="M496 72 V326" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="320" y="118" font-size="22" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, Menlo, Consolas, monospace">await present(.picker,</text>
<text x="320" y="146" font-size="22" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, Menlo, Consolas, monospace">awaiting: Item.self)</text>
<path d="M144 170 H496" fill="none" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#result-dark-arrow)"/>
<rect x="32" y="198" width="224" height="54" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="144.0" y="233.0" font-size="24" text-anchor="middle" fill="#FFFFFF">Waiting</text>
<rect x="384" y="198" width="224" height="54" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="496.0" y="233.0" font-size="24" text-anchor="middle" fill="#FFFFFF">Choose item</text>
<text x="320" y="282" font-size="22" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, Menlo, Consolas, monospace">dismissCoordinator(</text>
<text x="320" y="310" font-size="22" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, Menlo, Consolas, monospace">returning: item)</text>
<path d="M496 326 H144" fill="none" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#result-dark-arrow)"/>
<text x="320" y="356" font-size="22" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, Menlo, Consolas, monospace">Item?</text>
<rect x="32" y="376" width="224" height="54" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="144.0" y="411.0" font-size="24" text-anchor="middle" fill="#FFFFFF">Resumes</text>
<text x="496" y="408" font-size="22" text-anchor="middle" fill="#FFFFFF">Child removed</text>
<text x="16" y="468" font-size="22" text-anchor="start" fill="#FFFFFF">Dismiss without a value → nil</text>
<text x="16" y="502" font-size="22" text-anchor="start" fill="#FFFFFF">Cancel the waiting task → nil; UI stays open</text>
</g>
</svg>
