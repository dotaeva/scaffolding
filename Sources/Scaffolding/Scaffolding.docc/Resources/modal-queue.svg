<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-labelledby="queue-light-title queue-light-desc">
<title id="queue-light-title">Modal queue operations</title>
<desc id="queue-light-desc">All requests have the same owner. Each action starts with A visible and B and C queued. dismissPresentedModal removes A and advances B. dismissModal removes C. cancelPendingModals removes B and C.</desc>
<defs>
<marker id="queue-light-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#000000" stroke-width="1.5"/></marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif">
<text x="16" y="26" font-size="22" text-anchor="start" fill="#000000">Same starting queue for each action:</text>
<rect x="16" y="44" width="176" height="64" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="104.0" y="70.0" font-size="24" text-anchor="middle" fill="#000000">A</text>
<text x="104.0" y="98.0" font-size="20" text-anchor="middle" fill="#000000">Visible</text>
<rect x="232" y="44" width="176" height="64" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="320.0" y="70.0" font-size="24" text-anchor="middle" fill="#000000">B</text>
<text x="320.0" y="98.0" font-size="20" text-anchor="middle" fill="#000000">Queued</text>
<rect x="448" y="44" width="176" height="64" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="536.0" y="70.0" font-size="24" text-anchor="middle" fill="#000000">C</text>
<text x="536.0" y="98.0" font-size="20" text-anchor="middle" fill="#000000">Queued</text>
<path d="M192 76 H232" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#queue-light-arrow)"/>
<path d="M408 76 H448" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#queue-light-arrow)"/>
<text x="16" y="152" font-size="24" text-anchor="start" fill="#000000" font-family="ui-monospace, Menlo, Consolas, monospace">dismissPresentedModal()</text>
<path d="M16 196 H80" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#queue-light-arrow)"/>
<rect x="80" y="170" width="216" height="52" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="188.0" y="204.0" font-size="24" text-anchor="middle" fill="#000000">B · visible</text>
<rect x="328" y="170" width="216" height="52" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="436.0" y="204.0" font-size="24" text-anchor="middle" fill="#000000">C · queued</text>
<text x="16" y="268" font-size="24" text-anchor="start" fill="#000000" font-family="ui-monospace, Menlo, Consolas, monospace">dismissModal()</text>
<path d="M16 312 H80" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#queue-light-arrow)"/>
<rect x="80" y="286" width="216" height="52" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="188.0" y="320.0" font-size="24" text-anchor="middle" fill="#000000">A · visible</text>
<rect x="328" y="286" width="216" height="52" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="436.0" y="320.0" font-size="24" text-anchor="middle" fill="#000000">B · queued</text>
<text x="16" y="384" font-size="24" text-anchor="start" fill="#000000" font-family="ui-monospace, Menlo, Consolas, monospace">cancelPendingModals()</text>
<path d="M16 428 H80" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#queue-light-arrow)"/>
<rect x="80" y="402" width="216" height="52" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="188.0" y="436.0" font-size="24" text-anchor="middle" fill="#000000">A · visible</text>
</g>
</svg>
