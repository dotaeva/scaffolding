name: Deploy DocC to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pick the newest Xcode the image ships rather than pinning a version
      # that disappears with the next image bump.
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build DocC at the Pages root
        run: |
          mkdir -p ./docs
          swift package --allow-writing-to-directory ./docs \
            generate-documentation \
            --target Scaffolding \
            --output-path ./docs \
            --transform-for-static-hosting \
            --hosting-base-path scaffolding

      # The Pages artifact contains the DocC archive only:
      #   /documentation/scaffolding/ → library documentation

      # DocC has no route at the site root, so the bare Pages URL would
      # render its not-found screen. Redirect it to the docs landing page.
      - name: Redirect the site root to the documentation
        run: |
          cat > ./docs/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=/scaffolding/documentation/scaffolding/">
            <link rel="canonical" href="https://dotaeva.github.io/scaffolding/documentation/scaffolding/">
            <title>Scaffolding</title>
          </head>
          <body>
            <p>Redirecting to the <a href="/scaffolding/documentation/scaffolding/">Scaffolding documentation</a>…</p>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
